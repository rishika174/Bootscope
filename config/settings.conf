# BootScope Configuration File
# Location: /etc/bootscope/settings.conf or ./config/settings.conf

[general]
verbose = false
color_output = true
default_target = graphical.target

[thresholds]
# Flag services taking longer than warning_threshold_sec (in seconds)
warning_threshold_sec = 1.0
critical_threshold_sec = 3.0

# Memory warning threshold in MB
memory_threshold_mb = 64.0

[detector]
check_critical_path_only = false
flag_wait_online_services = true
flag_deprecated_settle = true
flag_cloud_init = true

[export]
default_format = terminal
html_theme = dark
